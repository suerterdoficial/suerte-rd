<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración | Suerte RD</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #050b10;
      --bg-sidebar: #09131c;
      --bg-card: #0d1a26;
      --bg-card-hover: #122333;
      --border-cyan: rgba(0, 229, 255, 0.25);
      --border-light: rgba(255, 255, 255, 0.08);
      
      --cyan: #00E5FF;
      --green: #00E676;
      --gold: #FFD700;
      --orange: #FF6D00;
      --purple: #A855F7;
      --red: #FF4D5E;
      
      --text-white: #FFFFFF;
      --text-muted: #8E9BAE;
      --text-dim: #5C6B7E;
      
      --font-heading: 'Space Grotesk', sans-serif;
      --font-body: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-dark);
      color: var(--text-white);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Modern Layout Grid */
    .admin-wrapper {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar Navigation */
    .admin-sidebar {
      width: 260px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-light);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      background: rgba(0, 229, 255, 0.1);
      border: 1.5px solid var(--cyan);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
    }

    .brand-name {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-white);
      letter-spacing: -0.5px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .nav-item {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
      text-align: left;
      width: 100%;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-white);
    }

    .nav-item.active {
      background: rgba(0, 229, 255, 0.1);
      border-color: var(--border-cyan);
      color: var(--cyan);
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.1);
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
    }

    /* Main Container */
    .admin-main {
      flex: 1;
      padding: 28px 36px 60px;
      min-width: 0;
    }

    /* Top Navigation Header */
    .top-header {
      background: var(--bg-card);
      border: 1px solid var(--border-cyan);
      border-radius: 20px;
      padding: 20px 28px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .header-title {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-white);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      background: rgba(0, 230, 118, 0.12);
      color: var(--green);
      border: 1px solid var(--green);
      font-size: 0.72rem;
      font-family: var(--font-mono);
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .header-sub {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    /* Placeholder Welcome Workspace */
    .workspace-placeholder {
      background: var(--bg-card);
      border: 1px dashed var(--border-cyan);
      border-radius: 24px;
      padding: 60px 40px;
      text-align: center;
    }

    .workspace-icon {
      width: 70px;
      height: 70px;
      background: rgba(0, 229, 255, 0.1);
      border: 2px solid var(--cyan);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: var(--cyan);
    }

    .workspace-title {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-white);
    }

    .workspace-desc {
      color: var(--text-muted);
      max-width: 520px;
      margin: 0 auto 28px;
      font-size: 0.95rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="admin-wrapper">
    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar">
      <div class="brand-box">
        <div class="brand-logo">
          <i data-lucide="shield"></i>
        </div>
        <span class="brand-name">Suerte RD</span>
      </div>

      <nav class="nav-list" id="sidebarNavList">
        <button class="nav-item active" data-tab="dashboard">
          <i data-lucide="layout-dashboard"></i> Panel Principal
        </button>
      </nav>

      <div style="margin-top: auto;">
        <button class="nav-item" onclick="window.location.href='/'">
          <i data-lucide="globe"></i> Ir a la Web Principal
        </button>
      </div>
    </aside>

    <!-- Main Content Workspace -->
    <main class="admin-main">
      <!-- Topbar Header -->
      <header class="top-header">
        <div>
          <div class="header-title">
            <span>Panel de Administración</span>
            <span class="status-badge">● Sistema Listo</span>
          </div>
          <div class="header-sub">Suerte RD • Control General en Tiempo Real</div>
        </div>

        <div id="headerActions">
          <!-- Dynamic header tools -->
        </div>
      </header>

      <!-- Workspace Container -->
      <div id="adminWorkspace">
        <div class="workspace-placeholder">
          <div class="workspace-icon">
            <i data-lucide="sparkles" style="width:36px; height:36px;"></i>
          </div>
          <h2 class="workspace-title">Página Admin Lista para Diseñar</h2>
          <p class="workspace-desc">
            Hemos preparado una estructura desde cero totalmente limpia, rápida y elegante. Dime cuál detalle o sección quieres que agreguemos primero.
          </p>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/admin.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
